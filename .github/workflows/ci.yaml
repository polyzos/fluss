name: CI
on:
  push:
    branches:
      - main
      - release-**
      - ci-**
    paths-ignore:
      - 'website/**'
      - 'helm/**'
      - 'fluss-rust/**'
      - 'fluss-gateway/**'
      - 'fluss-spark/**'
      - 'devkit/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'helm/**'
      - 'fluss-rust/**'
      - 'fluss-gateway/**'
      - 'fluss-spark/**'
      - 'devkit/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  compile-on-jdk8:
    name: "Compile Java 8"
    # Runs on arm64, whose queue stays short at peak hours. Release branches stay on x86.
    runs-on: ${{ startsWith(github.ref, 'refs/heads/release-') && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Build
        run: |
          mvn -T 1C -B clean install -DskipTests -Pjava8

  build-on-jdk17:
    name: "Java 17"
    uses: ./.github/workflows/ci-template.yaml
    with:
      java-version: "17"
      modules: '["core","flink1","flink2","lake"]'

  # Full Java 21 tests run nightly; per PR only check that everything builds.
  compile-on-jdk21:
    name: "Compile Java 21"
    uses: ./.github/workflows/ci-template.yaml
    with:
      java-version: "21"
      modules: '["compile"]'
      skip-tests: true

  # Classes built on a newer JDK must still link on Java 11, the bytecode target. Release 0.9.1
  # was built without the release flag and failed on Java 11 with NoSuchMethodError.
  java11-runtime-on-jdk17-build:
    name: "Java 11 runtime, built on Java 17"
    runs-on: ${{ startsWith(github.ref, 'refs/heads/release-') && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up JDK 11
        id: jdk11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build on Java 17, test on Java 11
        run: |
          JAVA11="${{ steps.jdk11.outputs.path }}/bin/java"
          mvn -B verify -pl fluss-common -am -Djvm="$JAVA11"
          mvn -B verify -pl fluss-server -am -Djvm="$JAVA11" -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest='org/apache/fluss/server/log/**/*Test,org/apache/fluss/server/kv/**/*Test'
